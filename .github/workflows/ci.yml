name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.8", "3.9", "3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # numpy is needed by the cortex_v2 regression tests; the core needs nothing.
          python -m pip install pytest numpy

      - name: Run tests
        run: python -m pytest -q

  research-smoke:
    # The research tests skip cleanly when torch is absent (core-only
    # installs), but at least one job must actually EXECUTE them.
    name: research smoke (torch, CPU)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package with experimental deps (CPU torch)
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e ".[experimental,test]" scipy

      - name: Run research tests (deps required — missing torch/scipy fails, never skips)
        env:
          LIVNIUM_REQUIRE_RESEARCH_DEPS: "1"
        run: python -m pytest tests/test_research.py -q

  lint:
    name: lint & format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install tools
        run: python -m pip install ruff black

      - name: Ruff
        run: python -m ruff check .

      - name: Black
        run: python -m black --check .
