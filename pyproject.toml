# Workspace-level tooling config only. The installable packages live in
# packages/livnium-core and packages/vector-collapse — each has its own
# pyproject.toml. Install for development with:
#   pip install -e packages/livnium-core -e packages/vector-collapse

[tool.black]
line-length = 100
target-version = ["py38"]
# Lint/format applies to the proven packages only. Research prototypes keep
# their deliberate compact style.
extend-exclude = '/(research|benchmarks|apps|scratch|reached|ramsey|images)/'

[tool.ruff]
line-length = 100
target-version = "py38"
# Same scope as black: packages are held to lint; research folders are not.
extend-exclude = ["research", "benchmarks", "apps", "scratch", "reached", "ramsey", "images"]

[tool.ruff.lint]
# Pycodestyle (E), pyflakes (F), and import sorting (I).
select = ["E", "F", "I"]
# E741: single-letter names like I (identity matrix) and l are meaningful in the
#       geometry/math code and are kept intentionally.
ignore = ["E741"]

[tool.pytest.ini_options]
testpaths = [
    "packages/livnium-core/tests",
    "packages/vector-collapse/tests",
    "research/embeddings/noun-collapse",
]
